<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=390,initial-scale=1"><title>Login - Antimahue</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:390px;height:844px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(180deg,#5C3D6E 0%,#8B5E9E 40%,#F5F0F8 40%,#F5F0F8 100%);display:flex;flex-direction:column;align-items:center}
.logo-area{padding-top:80px;text-align:center}
.logo-placeholder{width:100px;height:100px;background:rgba(255,255,255,.2);border-radius:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:42px}
.app-name{color:#fff;font-size:28px;font-weight:700;letter-spacing:-.5px}
.pin-area{margin-top:48px;width:100%;padding:0 40px;text-align:center}
.pin-label{font-size:15px;color:#5C3D6E;font-weight:500;margin-bottom:24px}
.pin-dots{display:flex;justify-content:center;gap:16px;margin-bottom:32px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #8B5E9E;transition:all .2s}
.pin-dot.filled{background:#8B5E9E}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.pin-key{width:72px;height:72px;border-radius:50%;border:1px solid #E0D0E8;background:#fff;font-size:22px;color:#5C3D6E;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pin-key:active{background:#8B5E9E;color:#fff;transform:scale(.95)}
.pin-key.wide{grid-column:span 3;width:auto;border-radius:36px;font-size:14px;font-weight:500}
.user-selector{margin-top:36px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.user-chip{padding:8px 18px;border-radius:20px;border:1px solid #D0B8E0;background:#fff;color:#5C3D6E;font-size:13px;cursor:pointer;transition:all .15s}
.user-chip.active{background:#8B5E9E;color:#fff;border-color:#8B5E9E}
</style>
</head>
<body>
<div class="logo-area">
  <div class="logo-placeholder">🧶</div>
  <div class="app-name">Antimahue</div>
</div>
<div class="pin-area">
  <div class="pin-label">Ingresá tu PIN</div>
  <div class="pin-dots">
    <div class="pin-dot filled"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
  </div>
  <div class="pin-pad">
    <div class="pin-key">1</div><div class="pin-key">2</div><div class="pin-key">3</div>
    <div class="pin-key">4</div><div class="pin-key">5</div><div class="pin-key">6</div>
    <div class="pin-key">7</div><div class="pin-key">8</div><div class="pin-key">9</div>
    <div class="pin-key"></div><div class="pin-key">0</div><div class="pin-key" style="font-size:12px">⌫</div>
  </div>
</div>
<div class="user-selector">
  <div class="user-chip active">Angélica</div>
  <div class="user-chip">Camila</div>
  <div class="user-chip">María</div>
</div>
</body>
</html>
