<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=390,initial-scale=1"><title>Nuevo Producto - Antimahue</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:390px;height:844px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F5F0F8;display:flex;flex-direction:column}
.top-bar{background:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #F0E8F5}
.back-btn{font-size:20px;color:#5C3D6E;cursor:pointer}
.top-bar h2{font-size:17px;color:#333;font-weight:600}
.form{flex:1;overflow-y:auto;padding:16px 20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:#888;font-weight:600;text-transform:uppercase;margin-bottom:6px}
.field input,.field select{width:100%;padding:12px 14px;border:1px solid #E0D0E8;border-radius:10px;font-size:14px;background:#fff;outline:none;color:#333}
.field input:focus,.field select:focus{border-color:#8B5E9E}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.barcode-field{position:relative}
.barcode-field input{padding-right:48px}
.scan-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:18px;color:#8B5E9E;cursor:pointer}
.photo-area{width:100%;height:140px;background:#fff;border:2px dashed #E0D0E8;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#B0A0BA;cursor:pointer}
.photo-area .icon{font-size:32px;margin-bottom:6px}
.photo-area p{font-size:13px}
.color-preview{display:flex;gap:8px;margin-top:6px}
.color-dot{width:24px;height:24px;border-radius:50%;border:2px solid #E0D0E8;cursor:pointer}
.color-dot.selected{border-color:#5C3D6E;box-shadow:0 0 0 2px rgba(92,61,110,.2)}
.btn-row{padding:16px 20px 24px;background:#fff;border-top:1px solid #F0E8F5}
.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,#5C3D6E,#8B5E9E);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="top-bar">
  <div class="back-btn">←</div>
  <h2>Nuevo producto</h2>
</div>
<div class="form">
  <div class="field barcode-field">
    <label>Código de barras</label>
    <input value="7804612100234" readonly style="color:#888">
    <div class="scan-icon">📷</div>
  </div>
  <div class="field">
    <label>Nombre del producto</label>
    <input placeholder="Ej: Lana Merino Baby Celeste" value="Lana Merino Baby Celeste">
  </div>
  <div class="row">
    <div class="field">
      <label>Tipo</label>
      <select>
        <option>Lana</option>
        <option>Algodón</option>
        <option>Hilo</option>
        <option>Palillo</option>
        <option>Crochet</option>
        <option>Accesorio</option>
      </select>
    </div>
    <div class="field">
      <label>Marca</label>
      <input placeholder="Ej: Revesderecho" value="Revesderecho">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>Grosor</label>
      <select>
        <option>Baby (fino)</option>
        <option>DK (medio)</option>
        <option>Worsted (semigrueso)</option>
        <option selected>Bulky (grueso)</option>
      </select>
    </div>
    <div class="field">
      <label>Peso / Metraje</label>
      <input placeholder="Ej: 100g / 120m" value="100g / 80m">
    </div>
  </div>
  <div class="field">
    <label>Color</label>
    <div class="color-preview">
      <div class="color-dot selected" style="background:#A8D8EA"></div>
      <div class="color-dot" style="background:#F8B4C8"></div>
      <div class="color-dot" style="background:#C4A882"></div>
      <div class="color-dot" style="background:#9B7CB8"></div>
      <div class="color-dot" style="background:#E8D8F2"></div>
      <div class="color-dot" style="background:#7DB87D"></div>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>💰 Costo</label>
      <input placeholder="$" value="3.200">
    </div>
    <div class="field">
      <label>🏷️ Precio venta</label>
      <input placeholder="$" style="font-weight:600" value="4.500">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>📦 Stock inicial</label>
      <input type="number" value="25">
    </div>
    <div class="field">
      <label>⚠️ Stock mínimo</label>
      <input type="number" placeholder="Default: 5" value="3">
    </div>
  </div>
  <div class="field">
    <label>Proveedor</label>
    <select>
      <option>Distribuidora Textil del Sur</option>
      <option>Lanas Nacionales Ltda.</option>
      <option>Importadora Hilos y Más</option>
    </select>
  </div>
  <div class="field">
    <label>Foto del producto</label>
    <div class="photo-area">
      <div class="icon">📸</div>
      <p>Tocá para sacar una foto</p>
    </div>
  </div>
</div>
<div class="btn-row">
  <button class="btn-primary">Guardar producto</button>
</div>
</body>
</html>
