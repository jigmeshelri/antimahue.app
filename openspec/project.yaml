project:
  name: antimahue.app
  stack:
    frontend:
      type: SPA
      bundler: Vite
      library: React 19
      styling: Tailwind CSS 4
      language: TypeScript
      pwa: vite-plugin-pwa
    backend:
      provider: Supabase
      services:
        - PostgreSQL
        - Auth
        - Storage
        - RLS
        - PostgREST
        - Edge Functions
      region: sa-east-1 (São Paulo)
    host:
      target: TBD  # Vercel | Cloudflare Pages — reversible (static bundle, edge)
    package_manager: pnpm@11
    principles:
      - security-first
  persistence:
    mode: openspec
    path: openspec/
  state:
    initialized: true
    active_changes:
      - setup-stack
      - color-palette-assistant
